<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TapScript</title>
<style>
:root {color-scheme:light dark}
body {margin:0;padding:0 10px;background:light-dark(#ebe9f5,#11121a)}
#pocket-preview [hidden] {display:none}
#pocket-preview #project-status:not(:empty), #pocket-preview #execution-status:not(:empty) {padding:0 16px 10px;color:var(--dim)}
#pocket-preview pre {margin:0;padding:12px 16px;background:var(--code);white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head><body>
<div class="viz-dotted-background" id="pocket-preview">
  <section class="pocket" aria-label="TapScript editor">
    <header><div><div class="wordmark">TapScript</div><h2>session.py</h2></div><span class="language">Python 3</span></header>
    <div class="editor" aria-label="Python code">
      <div class="rows"></div>
      <div class="draft"><span class="number"></span><div class="draft-code" aria-live="polite"></div></div>
    </div>
    <div id="execution-status" role="status"></div>
    <pre id="result" aria-live="polite" hidden></pre>
    <section class="composer" aria-label="Build a line">
      <div class="toolbar">
        <div><div class="eyebrow">INDENT</div><div class="depth" aria-live="polite"></div></div>
      </div>
      <div class="prompt" aria-live="polite"></div>
      <div class="entry-controls">
        <div class="choices"></div>
        <div class="numeric" aria-label="Number pad" hidden></div>
      </div>
      <div class="name-keys" aria-label="Variable name keys" hidden></div>
      <div class="actions"><button type="button" data-action="back">Undo</button><button type="button" data-action="step">Step out</button></div>
    </section>
    <div class="runbar">
      <button id="save">Save .py</button><button id="save-project">Save project</button>
      <button id="open-project">Open project</button><input id="project-file" type="file" accept=".tapscript,.json" hidden>
      <button id="replay">Restart &amp; replay</button><button id="stop" disabled>Stop</button>
    </div>
    <div id="project-status" role="status"></div>
  </section>
</div>
<style>
#pocket-preview {color-scheme:light dark; padding:20px 0; font-family:system-ui,sans-serif}
#pocket-preview .pocket {--paper:light-dark(#fbfbff,#191b27);--code:light-dark(#f1f1fa,#222638);--ink:light-dark(#22243a,#eff0ff);--dim:light-dark(#565c76,#adb4d3);--edge:light-dark(#d9dced,#3e4563);--brand:light-dark(#5132a6,#c4afff);--on-brand:light-dark(#fff,#26203e);--active:light-dark(#e8dfff,#3d305e);--variable:light-dark(#006354,#80e1cc);--number:light-dark(#8e3a17,#ffb388);max-width:396px;margin:auto;border:1px solid var(--edge);border-radius:25px;overflow:hidden;background:var(--paper);color:var(--ink);box-shadow:0 12px 30px #23134626}
#pocket-preview header,#pocket-preview .toolbar {display:flex;align-items:center;justify-content:space-between;gap:8px}
#pocket-preview header {padding:16px 18px;border-bottom:1px solid var(--edge)}
#pocket-preview h2 {margin:2px 0 0;font:600 20px ui-monospace,monospace}
#pocket-preview .wordmark,#pocket-preview .eyebrow {font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--dim)}
#pocket-preview .language {font-size:12px;color:var(--dim);background:var(--code);padding:5px 9px;border-radius:20px}
#pocket-preview .editor {background:var(--code);padding:12px 10px;min-height:145px;font:14px/1.5 ui-monospace,monospace}
#pocket-preview .line,#pocket-preview .draft {display:grid;grid-template-columns:28px minmax(0,1fr);align-items:start;padding:5px 3px}
#pocket-preview .draft {background:var(--active);border-radius:8px}
#pocket-preview .number {color:var(--dim);text-align:center;font-size:12px;padding-top:2px}
#pocket-preview .line-code,#pocket-preview .draft-code {padding-left:calc(var(--depth) * clamp(10px, 4vw, 19px));overflow-wrap:anywhere}
#pocket-preview .line-code {background:repeating-linear-gradient(90deg,var(--edge) 0 1px,transparent 1px clamp(10px, 4vw, 19px)) no-repeat;background-size:calc(var(--depth) * clamp(10px, 4vw, 19px)) 100%}
#pocket-preview .keyword {color:var(--brand);font-weight:650}
#pocket-preview .variable {color:var(--variable)}
#pocket-preview .literal {color:var(--number)}
#pocket-preview .slot {display:inline-block;border-bottom:1px dashed var(--brand);color:var(--brand);padding:0 2px}
#pocket-preview .composer {padding:12px 16px 16px}
#pocket-preview .toolbar {padding-bottom:10px;border-bottom:1px solid var(--edge)}
#pocket-preview .depth {font-size:13px;margin-top:3px}
#pocket-preview .choices,#pocket-preview .actions {display:flex;gap:8px;flex-wrap:wrap}
#pocket-preview .prompt {margin:12px 0 8px;font-size:14px;font-weight:650}
#pocket-preview button {font:inherit;min-width:44px;min-height:44px;padding:6px 10px;border:1px solid var(--edge);border-radius:10px;background:var(--code);color:var(--ink)}
#pocket-preview button:disabled {opacity:.42}
#pocket-preview .choices button {font:600 14px ui-monospace,monospace;background:var(--active);color:var(--brand)}
#pocket-preview .choices button[data-kind="variable"] {color:var(--variable)}
#pocket-preview .choices button[data-kind="literal"] {color:var(--number)}
#pocket-preview .actions {margin-top:12px}
#pocket-preview .entry-controls {display:flex;flex-wrap:wrap;align-items:start;gap:8px}
#pocket-preview .line-code button {min-width:0;min-height:0;padding:2px;border:0;border-radius:4px;background:transparent;font:inherit}
#pocket-preview .line-code button[aria-pressed=true] {background:var(--active)}
#pocket-preview .line > button {min-width:0;min-height:32px;padding:0;border:0;background:transparent}
#pocket-preview .line.selected {background:var(--active);border-radius:8px}
#pocket-preview .choices {flex:1 0 130px;min-width:0}
#pocket-preview .choices button {max-width:100%;overflow-wrap:anywhere}
#pocket-preview .numeric:not([hidden]) {flex:1 0 144px;display:grid;grid-template-columns:repeat(3,minmax(44px,1fr));gap:6px}
#pocket-preview .line-code,#pocket-preview .draft-code {white-space:pre-wrap}
#pocket-preview .name-keys:not([hidden]) {display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:4px;margin-top:8px}
#pocket-preview [data-action="step"] {flex:1;background:var(--brand);color:var(--on-brand);font-weight:650}
</style>
<script src="project.js"></script>
<script src="editor.js"></script>
<script src="app.js"></script></body></html>
